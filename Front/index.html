<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja de Produtos</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <h1>MinhaLoja</h1>
            <nav>
                <a href="#">PC Gamer</a>
                <a href="#">Notebooks</a>
                <a href="#">Monitores</a>
                <a href="#">Periféricos</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Cadastrar Novo Produto</h2>
            <form id="add-product-form">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Nome do Produto" required>
                </div>
                <div class="form-group">
                    <input type="text" id="description" name="description" placeholder="Descrição" required>
                </div>
                <div class="form-group">
                    <input type="number" id="price" name="price" step="0.01" placeholder="Preço (Ex: 99.99)" required>
                </div>
                <div class="form-group">
                    <input type="url" id="imageUrl" name="imageUrl" placeholder="URL da Imagem" required>
                </div>
                <button type="submit" class="btn-submit">Adicionar Produto</button>
            </form>
        </section>

        <section class="products-section">
            <h2>Nossos Produtos</h2>
            <div id="product-grid" class="product-grid">
                </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 - Projeto Frontend para API de Produtos</p>
    </footer>

    <script src="static/script.js"></script>
</body>
</html>
